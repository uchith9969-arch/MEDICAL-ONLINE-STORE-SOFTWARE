<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Supplier Inventory</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        rel="stylesheet">

    <style>

        :root {
            --primary: #1a9e6e;
            --primary-light: #22c98d;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #0F172A;
            color: #fff;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 28px 32px;
            min-height: 100vh;
        }

        /* Animated Mesh Background */
        .bg-mesh {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(16,185,129,0.22) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 85% 80%, rgba(13,148,136,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(15,23,42,1) 0%, rgba(15,23,42,1) 100%);
        }

        /* Grid Lines */
        .grid-lines {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
        }

        h1 i { color: #10B981; margin-right: 10px; }

        .table-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            color: #fff;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        th {
            background: rgba(255,255,255,0.04);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.45);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        td { color: rgba(255,255,255,0.85); }
        tr:hover td { background: rgba(255,255,255,0.04); }
        tr:last-child td { border-bottom: none; }

        .stock {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            background: rgba(16,185,129,0.18);
            color: #34d399;
        }

        /* Floating Glow Orbs */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
        .orb1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(16,185,129,0.30) 0%, transparent 70%); top: -160px; left: -120px; animation: orbFloat 12s ease-in-out infinite alternate; }
        .orb2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(13,148,136,0.25) 0%, transparent 70%); bottom: -100px; right: -80px; animation: orbFloat 15s ease-in-out infinite alternate-reverse; }
        .orb3 { width: 240px; height: 240px; background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, transparent 70%); top: 50%; left: 60%; animation: orbFloat 9s ease-in-out infinite alternate; }
        @keyframes orbFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

        /* Floating Particles */
        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; background: rgba(16,185,129,0.5); animation: particleDrift linear infinite; }
        @keyframes particleDrift { from { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.6; } to { transform: translateY(-10vh) rotate(720deg); opacity: 0; } }

    </style>

</head>

<body>
  <div class="bg-mesh"></div>
  <div class="grid-lines"></div>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
  <div class="particles" id="particles"></div>

  <div class="page-wrap">

    <h1>
        <i class="fas fa-box"></i>
        My Inventory
    </h1>

    <div class="table-card">
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Medicine</th>
                <th>Category</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody id="inventoryTable">
            <tr>
                <td colspan="5">Loading...</td>
            </tr>
        </tbody>

    </table>
    </div>

  </div>

    <script>

        async function loadInventory() {

            try {

                const supplierId =
                    localStorage.getItem("userId");

                const response = await fetch(
                    `/api/supplier/inventory/${supplierId}`
                );

                const data = await response.json();

                const table =
                    document.getElementById("inventoryTable");

                if (data.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="5">
                                No inventory found
                            </td>
                        </tr>
                    `;

                    return;
                }

                table.innerHTML = data.map(item => `

                    <tr>
                        <td>${item.id}</td>
                        <td>${item.medicine.name}</td>
                        <td>${item.medicine.category}</td>
                        <td>LKR ${item.medicine.price}</td>
                        <td><span class="stock">${item.quantity}</span></td>
                    </tr>

                `).join("");

            } catch (error) {

                console.error(error);

                alert("Error loading inventory");
            }
        }

        loadInventory();

        /* Floating Particles */
        (function () {
          const container = document.getElementById("particles");
          for (let i = 0; i < 18; i++) {
            const p = document.createElement("div");
            p.className = "particle";
            const size = Math.random() * 3 + 1.5;
            p.style.cssText = "width:"+size+"px; height:"+size+"px; left:"+Math.random()*100+"%; animation-duration:"+(Math.random()*18+12)+"s; animation-delay:"+(Math.random()*-20)+"s; opacity:"+(Math.random()*0.4+0.1)+";";
            container.appendChild(p);
          }
        })();

    </script>

</body>

</html>
