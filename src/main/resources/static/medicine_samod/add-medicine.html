<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Medicine - MediCore</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --surface: rgba(255,255,255,0.05);
    --primary: #1a9e6e;
    --primary-light: #22c98d;
    --border: rgba(255,255,255,0.09);
    --text: #ffffff;
    --text-muted: rgba(255,255,255,0.5);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0F172A;
    color: #fff;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── Animated Mesh Background ── */
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(16,185,129,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 80%, rgba(13,148,136,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(15,23,42,1) 0%, rgba(15,23,42,1) 100%);
  }

  /* ── Grid Lines ── */
  .grid-lines {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16,185,129,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(16px);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    margin-bottom: 8px;
    color: #fff;
  }
  .sub {
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: rgba(255,255,255,0.85);
  }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    background: rgba(255,255,255,0.06);
    color: #fff;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }
  select option { background: #1e293b; color: #fff; }
  input:focus, select:focus, textarea:focus {
    border-color: #10B981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .checkbox-group input {
    width: auto;
    accent-color: var(--primary);
  }
  .checkbox-group label { color: rgba(255,255,255,0.85); }
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 40px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(26,158,110,0.35);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.14);
  }
  .error {
    color: #ef4444;
    font-size: 0.8rem;
    margin-top: 4px;
  }
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 300;
  }
  .toast {
    background: #1e293b;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ===== Floating Glow Orbs ===== */
  .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
  .orb1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(16,185,129,0.30) 0%, transparent 70%); top: -160px; left: -120px; animation: orbFloat 12s ease-in-out infinite alternate; }
  .orb2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(13,148,136,0.25) 0%, transparent 70%); bottom: -100px; right: -80px; animation: orbFloat 15s ease-in-out infinite alternate-reverse; }
  .orb3 { width: 240px; height: 240px; background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, transparent 70%); top: 50%; left: 60%; animation: orbFloat 9s ease-in-out infinite alternate; }
  @keyframes orbFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

  /* ===== Floating Particles ===== */
  .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .particle { position: absolute; border-radius: 50%; background: rgba(16,185,129,0.5); animation: particleDrift linear infinite; }
  @keyframes particleDrift { from { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.6; } to { transform: translateY(-10vh) rotate(720deg); opacity: 0; } }

  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="grid-lines"></div>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
  <div class="particles" id="particles"></div>

<div class="container">
  <div class="card">
    <h1><i class="fas fa-plus-circle"></i> Add New Medicine</h1>
    <div class="sub">Fill in the details below</div>
    <form id="addMedicineForm">
      <div class="form-group">
        <label>Medicine Name *</label>
        <input type="text" id="name" required placeholder="e.g., Paracetamol 500mg">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="2" placeholder="Optional description"></textarea>
      </div>
      <div class="form-group">
        <label>Price (LKR) *</label>
        <input type="number" id="price" step="0.01" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Stock Quantity *</label>
        <input type="number" id="stockQuantity" required placeholder="0">
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select id="category" required>
          <option value="TABLET">Tablet</option>
          <option value="CAPSULE">Capsule</option>
          <option value="SYRUP">Syrup</option>
          <option value="INJECTION">Injection</option>
          <option value="CREAM">Cream</option>
          <option value="DROPS">Drops</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="requiresPrescription">
        <label style="margin:0">Requires Prescription</label>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Medicine</button>
        <a href="medicine-list.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<script>
  const API_BASE = '';
  const form = document.getElementById('addMedicineForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const medicine = {
      name: document.getElementById('name').value.trim(),
      description: document.getElementById('description').value.trim(),
      price: parseFloat(document.getElementById('price').value),
      stockQuantity: parseInt(document.getElementById('stockQuantity').value),
      category: document.getElementById('category').value,
      requiresPrescription: document.getElementById('requiresPrescription').checked
    };
    if (!medicine.name || isNaN(medicine.price) || isNaN(medicine.stockQuantity)) {
      showToast('Please fill all required fields', 'error');
      return;
    }
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    try {
      const res = await fetch(`${API_BASE}/api/medicines`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(medicine)
      });
      if (res.ok) {
        showToast('Medicine added successfully!');
        setTimeout(() => window.location.href = 'medicine-list.html', 1500);
      } else {
        const error = await res.text();
        showToast('Error: ' + error, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Medicine';
      }
    } catch (err) {
      showToast('Server error', 'error');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Medicine';
    }
  });
  function showToast(msg, type = 'success') {
    const tc = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    tc.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

    /* ===== Floating Particles ===== */
    (function () {
      const container = document.getElementById("particles");
      for (let i = 0; i < 18; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = Math.random() * 3 + 1.5;
        p.style.cssText = "width:"+size+"px; height:"+size+"px; left:"+Math.random()*100+"%; animation-duration:"+(Math.random()*18+12)+"s; animation-delay:"+(Math.random()*-20)+"s; opacity:"+(Math.random()*0.4+0.1)+";";
        container.appendChild(p);
      }
    })();

  </script>
</body>
</html>
