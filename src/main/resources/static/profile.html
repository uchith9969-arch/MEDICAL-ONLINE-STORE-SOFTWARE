<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - MediCore</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --primary: #1a9e6e;
      --primary-glow: rgba(16,185,129,0.22);
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-bg: rgba(239,68,68,0.1);
      --danger-border: rgba(239,68,68,0.3);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); min-height: 100vh; }
    body { font-family: 'DM Sans', sans-serif; padding: 24px; }

    /* ── Background effects ── */
    .bg-mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(16,185,129,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 85% 80%, rgba(13,148,136,0.18) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(15,23,42,1) 0%, rgba(15,23,42,1) 100%);
    }
    .grid-lines { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .orb1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(16,185,129,0.30) 0%, transparent 70%); top: -160px; left: -120px; animation: orbFloat 12s ease-in-out infinite alternate; }
    .orb2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(13,148,136,0.25) 0%, transparent 70%); bottom: -100px; right: -80px; animation: orbFloat 15s ease-in-out infinite alternate-reverse; }
    @keyframes orbFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

    /* ── Layout ── */
    .page { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; }

    /* ── Header ── */
    .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all 0.2s; }
    .back-btn:hover { background: var(--surface-hover); color: var(--text); }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 700; }

    /* ── Profile card ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; backdrop-filter: blur(10px); }

    .avatar-row { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #0D9488);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; color: white;
      flex-shrink: 0; }
    .avatar-info h2 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; }
    .role-badge { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }

    /* ── Info rows ── */
    .info-row { display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-label { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.9rem; }
    .info-label i { width: 16px; text-align: center; color: #10B981; }
    .info-value { font-weight: 500; color: var(--text); font-size: 0.95rem; }

    /* ── Edit form (hidden by default) ── */
    .edit-form { display: none; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
    .edit-form.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #10B981; background: rgba(16,185,129,0.05); }
    .form-group input::placeholder { color: #475569; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .btn { padding: 10px 22px; border-radius: 40px; font-weight: 600; font-size: 0.9rem;
      border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #10B981; color: white; }
    .btn-primary:hover { background: #0D9488; transform: translateY(-1px); }
    .btn-ghost { background: var(--surface-hover); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Danger zone card ── */
    .danger-card { background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: var(--radius); padding: 24px; }
    .danger-card h3 { color: var(--danger); font-family: 'Syne', sans-serif; font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .danger-card p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 16px; line-height: 1.6; }

    /* ── Delete confirm modal ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal { background: #1e293b; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; max-width: 420px; width: 90%; text-align: center; }
    .modal-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--danger-bg);
      border: 1px solid var(--danger-border); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 24px; color: var(--danger); }
    .modal h3 { font-family: 'Syne', sans-serif; font-size: 1.2rem; margin-bottom: 10px; }
    .modal p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }
    .modal-btns { display: flex; gap: 12px; justify-content: center; }

    /* ── Toast notification ── */
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200;
      padding: 14px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      transform: translateY(80px); opacity: 0; transition: all 0.3s ease; pointer-events: none; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #10B981; }
    .toast.error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grid-lines"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="page">

  <!-- Header -->
  <div class="page-header">
    <a href="customer/dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <h1 class="page-title">My Profile</h1>
  </div>

  <!-- Profile Info Card -->
  <div class="card">
    <div class="avatar-row">
      <div class="avatar" id="avatar">--</div>
      <div class="avatar-info">
        <h2 id="fullName">Loading...</h2>
        <span class="role-badge" id="roleBadge">-</span>
      </div>
    </div>

    <!-- Read-only info rows -->
    <div class="info-row">
      <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
      <span class="info-value" id="email">-</span>
    </div>
    <div class="info-row">
      <span class="info-label"><i class="fas fa-phone"></i> Phone</span>
      <span class="info-value" id="phone">-</span>
    </div>
    <div class="info-row">
      <span class="info-label"><i class="fas fa-map-marker-alt"></i> Address</span>
      <span class="info-value" id="address">-</span>
    </div>

    <!-- Action buttons -->
    <div class="btn-row" style="margin-top: 24px;">
      <button class="btn btn-primary" onclick="toggleEditForm()">
        <i class="fas fa-pen"></i> <span id="editBtnText">Edit Profile</span>
      </button>
      <button class="btn btn-ghost" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

    <!-- Edit Form (hidden until Edit is clicked) -->
    <div class="edit-form" id="editForm">
      <div class="form-group">
        <label><i class="fas fa-phone" style="color:#10B981; margin-right:6px;"></i>Phone Number</label>
        <input type="text" id="inputPhone" placeholder="e.g. 0771234567" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-map-marker-alt" style="color:#10B981; margin-right:6px;"></i>Address</label>
        <input type="text" id="inputAddress" placeholder="e.g. 123 Main Street, Colombo" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">
          <i class="fas fa-check"></i> Save Changes
        </button>
        <button class="btn btn-ghost" onclick="toggleEditForm()">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Danger Zone Card -->
  <div class="danger-card">
    <h3><i class="fas fa-triangle-exclamation"></i> Danger Zone</h3>
    <p>Permanently delete your account and all associated data. This action cannot be undone.</p>
    <button class="btn btn-danger" onclick="showDeleteModal()">
      <i class="fas fa-trash"></i> Delete My Account
    </button>
  </div>

</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-icon"><i class="fas fa-trash"></i></div>
    <h3>Delete Account?</h3>
    <p>This will permanently delete your account, orders, and all data. You cannot undo this.</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="deleteAccount()">
        <i class="fas fa-trash"></i> Yes, Delete
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API_BASE = '';
  const userId = localStorage.getItem('userId');

  // Redirect to login if not logged in
  if (!userId) window.location.href = 'login.html';

  // ── Load profile on page open ──
  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/api/customer/profile?userId=${userId}`);
      const user = await res.json();

      document.getElementById('fullName').innerText = user.name || 'Unknown';
      document.getElementById('email').innerText = user.email || '-';
      document.getElementById('phone').innerText = user.phoneNumber || 'Not provided';
      document.getElementById('address').innerText = user.address || 'Not provided';
      document.getElementById('roleBadge').innerText = user.role || '-';

      // Fill edit inputs with current values ready to edit
      document.getElementById('inputPhone').value = user.phoneNumber || '';
      document.getElementById('inputAddress').value = user.address || '';

      // Avatar initials from name
      const initials = user.name ? user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) : '??';
      document.getElementById('avatar').innerText = initials;

    } catch (err) {
      showToast('Failed to load profile', 'error');
    }
  }

  // ── Toggle edit form open/close ──
  function toggleEditForm() {
    const form = document.getElementById('editForm');
    const btnText = document.getElementById('editBtnText');
    const isOpen = form.classList.contains('active');
    form.classList.toggle('active');
    btnText.innerText = isOpen ? 'Edit Profile' : 'Cancel Edit';
  }

  // ── Save address and phone number ──
  async function saveProfile() {
    const phone = document.getElementById('inputPhone').value.trim();
    const address = document.getElementById('inputAddress').value.trim();

    if (!phone && !address) {
      showToast('Please enter at least one field to update', 'error');
      return;
    }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      const res = await fetch(`${API_BASE}/api/customer/profile/${userId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber: phone, address: address })
      });

      if (!res.ok) throw new Error('Update failed');

      const updated = await res.json();

      // Update the displayed values on the page
      document.getElementById('phone').innerText = updated.phoneNumber || 'Not provided';
      document.getElementById('address').innerText = updated.address || 'Not provided';

      showToast('Profile updated successfully!', 'success');

      // Close the form after saving
      document.getElementById('editForm').classList.remove('active');
      document.getElementById('editBtnText').innerText = 'Edit Profile';

    } catch (err) {
      showToast('Failed to update profile. Try again.', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-check"></i> Save Changes';
    }
  }

  // ── Delete modal ──
  function showDeleteModal() {
    document.getElementById('deleteModal').classList.add('active');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
  }

  // ── Delete account ──
  async function deleteAccount() {
    const btn = document.getElementById('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';

    try {
      const res = await fetch(`${API_BASE}/api/customer/profile/${userId}`, {
        method: 'DELETE'
      });

      if (!res.ok) throw new Error('Delete failed');

      showToast('Account deleted. Redirecting...', 'success');

      // Clear all local storage and redirect to login after 2 seconds
      setTimeout(() => {
        localStorage.clear();
        window.location.href = 'login.html';
      }, 2000);

    } catch (err) {
      showToast('Failed to delete account. Try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-trash"></i> Yes, Delete';
      closeDeleteModal();
    }
  }

  // ── Logout ──
  function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
  }

  // ── Toast helper ──
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'circle-exclamation'}"></i> ${message}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  // Load profile when page opens
  loadProfile();
</script>
</body>
</html>
